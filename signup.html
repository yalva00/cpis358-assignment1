<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny &amp; Land Beauty Salon - Sign Up</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Master page: same header & menu on every page -->
    <header>
        <h1>Sunny &amp; Land<br>Beauty Salon</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="signup.html">Sign Up</a>
            <a href="login.html">Login</a>
            <a href="about.html">About Us</a>
        </nav>
    </header>

    <main>
        <section id="signup" class="auth-container">

            <!-- Left side: picture + list -->
            <article class="auth-side">
                <img src="images/seat.jpg" alt="Sunny & Land salon chair">
                <h2>Join Sunny &amp; Land</h2>
                <p>Create your account to book your appointments online.</p>

                <!-- List -->
                <ul class="benefits">
                    <li>Book any service in a few clicks</li>
                    <li>Save your favorite stylist</li>
                    <li>Get reminders before your appointment</li>
                </ul>
            </article>

            <!-- Right side: the sign-up form -->
            <article class="auth-card">
                <h2>Sign Up</h2>

                <!-- Form: onsubmit calls validateSignup() from script.js -->
                <form id="signupForm" novalidate onsubmit="return validateSignup()">

                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="Your name">
                        <small class="error-text" id="nameError"></small>
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" placeholder="example@email.com">
                        <small class="error-text" id="signupEmailError"></small>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="05XXXXXXXX">
                        <small class="error-text" id="phoneError"></small>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <!-- oninput: runs every time a letter is typed -->
                        <input type="password" id="signupPassword" placeholder="Create a password"
                               oninput="checkPasswordStrength()">
                        <!-- Strength bar: changes with JavaScript -->
                        <div class="strength-bar">
                            <div id="strengthFill"></div>
                        </div>
                        <small id="strengthText" class="strength-text"></small>
                        <small class="error-text" id="signupPasswordError"></small>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Repeat your password">
                        <small class="error-text" id="confirmError"></small>
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="terms">
                        <label for="terms">I agree to the salon booking terms</label>
                    </div>
                    <small class="error-text" id="termsError"></small>

                    <button type="submit" class="btn">Create Account</button>
                </form>

                <!-- Welcome card is added here by JavaScript -->
                <div id="welcomeBox"></div>

                <p class="switch-page">
                    Already have an account? <a href="login.html">Login</a>
                </p>
            </article>

        </section>
    </main>

    <footer>
        <a href="#signup">Back to top</a>
    </footer>

    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>
</html>
