<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunny &amp; Land Beauty Salon - Login</title>

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- External CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body id="top">

    <!-- Header & menu (same on every page) -->
    <header>
        <h1>Sunny &amp; Land<br>Beauty Salon</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="signup.html">Sign Up</a>
            <a href="login.html">Login</a>
            <a href="about.html">About Us</a>
        </nav>
    </header>

    <main>
        <section id="login" class="auth-container">

            <!-- Left box: picture and list -->
            <article class="auth-side">

                <!-- Image map (the middle of the picture links to about us) -->
                <img src="images/login-page.jpg" alt="Salon entrance door" usemap="#loginMap">
                <map name="loginMap">
                    <area shape="rect" coords="113,0,313,220" href="about.html" alt="About Us" title="About Us">
                </map>

                <h2>Welcome Back</h2>

                <!-- List -->
                <ul class="benefits">
                    <li>See all our services and prices in one place</li>
                    <li>Check our opening hours anytime</li>
                    <li>Be the first to hear about our offers</li>
                </ul>
            </article>

            <!-- Right box: the login form -->
            <article class="auth-card">
                <h2>Login</h2>

                <!-- Form: onsubmit calls our function -->
                <form id="loginForm" novalidate onsubmit="return validateLogin()">

                    <!-- Email field -->
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="example@email.com">
                        <small class="error-text" id="loginEmailError"></small>
                    </div>
                    <!-- Password field -->
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Your password">
                        <small class="error-text" id="loginPasswordError"></small>
                    </div>

                    <button type="submit" class="btn">Login</button>

                    <!-- This text changes with JavaScript -->
                    <p id="loginMessage" class="form-message"></p>
                </form>

                <p class="switch-page">
                    Don't have an account? <a href="signup.html">Sign up</a>
                </p>
            </article>

        </section>
    </main>

    <footer>
        <a href="#top">Back to top</a>
    </footer>

    <!-- External javascript file-->
    <script src="script.js"></script>

    <!-- Embedded JavaScript (inside the page) -->
    <script>


        // Requirement: Form Validation (runs when the form is submitted)
        function validateLogin() {
        var email = document.getElementById("loginEmail");
        var password = document.getElementById("loginPassword");
        var message = document.getElementById("loginMessage");
        var isValid = true;

        // Clear old errors mesaages
        clearError(email, "loginEmailError");
        clearError(password, "loginPasswordError");
        message.innerHTML = "";

        // Email check
        var emailText = email.value.trim();
        var atPosition = emailText.indexOf("@");
        var dotPosition = emailText.lastIndexOf(".");

        if (emailText == "") {
        showError(email, "loginEmailError", "Please enter your email");
        isValid = false;
        } else if (atPosition < 1 || dotPosition < atPosition + 2 || dotPosition == emailText.length - 1 || emailText.includes(" ")) {
        showError(email, "loginEmailError", "Email is not valid");
        isValid = false;
        }

        // Password check
        if (password.value == "") {
        showError(password, "loginPasswordError", "Please enter your password");
        isValid = false;
        } else if (password.value.length < 8) {
        showError(password, "loginPasswordError", "Password must be at least 8 characters");
        isValid = false;
        }

        // Show a green or a red message under button
        if (isValid) {
        message.innerHTML = "Welcome back! You are logged in.";
        message.style.color = "green";
        } else {
        message.innerHTML = "Please fix the errors above.";
        message.style.color = "#c0392b";
        }

        return false; // stop the page from reloading (static site)
        }
    </script>

</body>
</html>
